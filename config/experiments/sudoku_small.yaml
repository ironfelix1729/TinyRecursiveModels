defaults:
  - ../arch: trm
  - _self_

# Small, fast Sudoku run (single GPU) meant for understanding the training loop.
# This is *not* tuned for peak accuracy.

# Data
data_paths: ["data/sudoku-small"]
data_paths_test: []
evaluators: []  # generic metrics (accuracy/exact_accuracy/steps) still computed

# Training
global_batch_size: 64
epochs: 2000
eval_interval: 200
checkpoint_every_eval: True

# Optimizer / schedule
lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 100
beta1: 0.9
beta2: 0.95
weight_decay: 1.0

# Puzzle embedding optimizer (Sudoku builder uses a single "<blank>" id)
puzzle_emb_lr: 1e-4
puzzle_emb_weight_decay: 1.0

seed: 0
min_eval_interval: 0

# Optional: EMA often makes eval curves smoother
ema: True
ema_rate: 0.999
freeze_weights: False

# Model overrides for a quicker demo
arch:
  # fewer refinement steps during eval => faster, easier to reason about
  halt_max_steps: 8
  halt_exploration_prob: 0.10

  # lighter inner compute (still shows the "H_cycles/L_cycles" recursion structure)
  H_cycles: 3
  L_cycles: 6
  L_layers: 2

  # For Sudoku, position info is already baked into the fixed 9x9 flattening;
  # disabling RoPE keeps the demo simpler (optional).
  pos_encodings: none

  # Use MLP over sequence instead of attention for the "L" block (fastest)
  mlp_t: True
